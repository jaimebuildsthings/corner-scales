<text x="24" y="520" font-size="11.5" fill="#5f5e57" text-anchor="start">Build the desk test (diagram above) first. This adds a jack at each end so the pad and the box can be unplugged.</text>
<text x="24" y="540" font-size="11.5" fill="#5f5e57" text-anchor="start">Generic HX711 boards have only VCC (no VDD): connect it to 3V3. Each signal pair stays on one twisted pair of the Cat6.</text>
<text x="24" y="560" font-size="11.5" fill="#5f5e57" text-anchor="start">Measure before power-on: E+ to E− and A+ to A− should read about the same (~1 kΩ). See the checklist in wiring.md.</text>
</svg>
